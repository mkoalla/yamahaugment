name: lint, build, release linux binary

on:
  push:
    branches: [main]
    tags: [client-v*]

env:
  TARGET_PLATFORM: linux-amd64
  BIN_NAME: client-linux-amd64
  GO_DIR: client

jobs:
  lint:
    # go faster its free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: ${{ env.GO_DIR }}/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: ${{ env.GO_DIR }}

  build:
    if: startsWith(github.ref, 'refs/tags/v')

    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: setup
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: ${{ env.GO_DIR }}/go.sum

      - name: dependencies
        working-directory: ${{ env.GO_DIR }}
        run: go mod download

      - name: build
        working-directory: ${{ env.GO_DIR }}
        env:
          GOOS: linux
          CGO_ENABLED: 0
          GOARCH: amd64
        run: go build -o main -ldflags "-X 'yamaclient/lib/info/version.version=${{ github.ref_name }}' -X 'yamaclient/lib/info/version.source=https://api.github.com/repos/mkoalla/yamahaugment/releases'"

      - name: compress
        run: tar -czvf ${{ env.BIN_NAME }}-${{ github.ref_name }}.tar.gz -C ${{ env.GO_DIR }} main

      - name: provide build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET_PLATFORM }}-latest
          path: ${{ env.BIN_NAME }}-${{ github.ref_name }}.tar.gz
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-slim

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_PLATFORM }}-latest
          path: ${{ env.TARGET_PLATFORM }}

      - name: make release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} ${{ env.TARGET_PLATFORM }} autorelease
          prerelease: true
          files: ${{env.TARGET_PLATFORM}}/*
