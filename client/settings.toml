[main]
runtime = "fluidsynth"      # midi bridge
default-track = "track.mid"

[driver]
audio-driver = "alsa"
midi-driver = "alsa_seq"
sound-fonts = ["/usr/share/soundfonts/FluidR3_GM.sf2"]

[http.node]
port = 33330
queue-size = 50
song-cache = 10

[http.limits]
body-prefer-kb = 32
cache-expiry-sec = 3600
